name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  recovery-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test:recovery

  privacy-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: running_coach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d running_coach_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DATABASE_ENV: test
      DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/running_coach_test
      DIRECT_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/running_coach_test
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: synthetic-ci-only-auth-secret-at-least-32-characters
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-password
      PGDATABASE: running_coach_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Mark the disposable CI database as nonproduction
        run: psql --no-psqlrc --set=ON_ERROR_STOP=1 --command "INSERT INTO database_identity (id, tier) VALUES (1, 'NON_PRODUCTION')"
      - run: pnpm test:db

  migrate-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [validate, privacy-regression, recovery-smoke]
    runs-on: ubuntu-latest
    environment: development-migrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply checked-in development migrations
        env:
          APP_DATABASE_ENV: development
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DIRECT_URL" ]; then
            echo 'Development database secrets are not configured'
            exit 1
          fi
          pnpm db:assert:development
          pnpm db:prepare:run70
          pnpm db:migrate
          pnpm db:grant:runtime
          pnpm db:status

  deploy-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: migrate-development
    runs-on: ubuntu-latest
    environment: development-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global vercel@65.9.0
      - name: Deploy checked commit to Vercel Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PREVIEW_ALIAS: ${{ vars.VERCEL_PREVIEW_ALIAS }}
          VERCEL_TEAM_SLUG: freeksons-projects
        run: |
          node scripts/vercel/check-vercel-deploy-domain.mjs preview
          if [[ "$VERCEL_PREVIEW_ALIAS" != 'running-coach-dev-freeksons.vercel.app' ]]; then
            echo 'VERCEL_PREVIEW_ALIAS must be the verified stable Preview domain'
            exit 1
          fi
          echo 'Vercel domain preflight passed; deploying Preview'
          if ! deployment_url="$(vercel deploy --yes --token "$VERCEL_TOKEN")"; then
            echo 'Preview deployment failed before alias assignment'
            exit 1
          fi
          if [[ ! "$deployment_url" =~ ^https://[a-z0-9-]+\.vercel\.app$ ]]; then
            echo 'Vercel did not return a valid Preview deployment URL'
            exit 1
          fi
          echo 'Vercel returned a valid Preview deployment URL; assigning the configured stable alias'
          node scripts/vercel/assign-vercel-preview-alias.mjs "$deployment_url"
          node scripts/vercel/verify-vercel-preview-alias.mjs "$deployment_url"

  migrate-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, privacy-regression, recovery-smoke]
    runs-on: ubuntu-latest
    environment: production-migrations
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply checked-in production migrations
        env:
          APP_DATABASE_ENV: production
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo 'Production migration secret is not configured'
            exit 1
          fi
          pnpm db:assert:production
          pnpm db:prepare:run70
          pnpm db:migrate
          pnpm db:grant:runtime
          pnpm db:status

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate-production
    runs-on: ubuntu-latest
    environment: production-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global vercel@65.9.0
      - name: Deploy checked commit to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PRODUCTION_HOST: ${{ vars.VERCEL_PRODUCTION_HOST }}
        run: |
          node scripts/vercel/check-vercel-deploy-domain.mjs production
          vercel deploy --yes --prod --token "$VERCEL_TOKEN"
